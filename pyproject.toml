[project]
name = "freqanki"
version = "2.0.0"
description = "Frequency-based Anki flashcard generator for 40+ languages"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Lutmak" }
]
keywords = ["anki", "flashcards", "language-learning", "wordfreq", "vocabulary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "genanki>=0.13.1",
    "gtts>=2.5.4",
    "pymorphy3>=2.0.6",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tatoebatools>=0.2.3",
    "wordfreq>=3.1.1",
    "click>=8.1.0",
    "rich>=13.0.0",
    "transliterate>=1.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
freqanki = "freqanki.cli:main"

[project.urls]
Homepage = "https://github.com/lutmak/anki-wordfreq"
Repository = "https://github.com/lutmak/anki-wordfreq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freqanki"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
